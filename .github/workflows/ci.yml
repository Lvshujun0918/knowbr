name: CI

# 提交前质量门：与本地 `make check` 完全一致。
# 后端跑 go vet / go test / go build；前端跑 vue-tsc 类型检查与 vite 打包。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: 后端（Go）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...

  web:
    name: 前端（Vue + Vite）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 单元测试
        run: pnpm test
      - name: 类型检查与打包
        run: pnpm build
